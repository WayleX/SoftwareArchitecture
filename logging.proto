syntax = "proto3";

package logging;

service LoggingService {
  rpc Log (LogRequest) returns (LogResponse);
  rpc GetLogs (Empty) returns (LogResponseList);
}

message LogRequest {
  string id = 1;
  string msg = 2;
}

message LogResponse {
  string status = 1;
}

message Empty {}

message LogResponseList {
  repeated string logs = 1;
}