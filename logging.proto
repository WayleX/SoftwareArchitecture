syntax = "proto3";

service LoggingService {
    rpc Log (LogRequest) returns (LogResponse);
    rpc GetLogs (Empty) returns (GetLogsResponse);
}

message LogRequest {
    string id = 1;
    string msg = 2;
}

message LogResponse {
    string status = 1;
}

message GetLogsResponse {
    string logs = 1;
}

message Empty {}